<!DOCTYPE html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Daniele Calò – Lean Six Sigma certificates</title>
<style>
  /* Vollkorn self-hosted: put the font file at fonts/Vollkorn.ttf in the repo.
     If missing, the browser falls back to Georgia / system serif. */
  @font-face {
    font-family: "Vollkorn";
    src: local("Vollkorn"), url("fonts/Vollkorn.ttf") format("truetype");
    font-weight: 400 900;
    font-style: normal;
    font-display: swap;
  }
  :root {
    --bg: #f7f9f6;
    --text: #1d2a22;
    --muted: #5b6b61;
    --line: #c9d8cd;
    --accent: #2f6b4a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151b17;
      --text: #e6ece8;
      --muted: #9fb0a5;
      --line: #2d3a32;
      --accent: #8fc7a5;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Vollkorn", Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    font-size: 1.1rem;
    line-height: 1.6;
  }
  main {
    max-width: 38rem;
    margin: 0 auto;
    padding: 3rem 1.25rem 4rem;
  }
  h1 { font-size: 2rem; font-weight: 600; margin: 0 0 .25rem; }
  .sub { color: var(--muted); margin: 0 0 2rem; }
  ul {
    list-style: none;
    margin: 0;
    padding: 0;
    border-top: 1px solid var(--line);
  }
  li { border-bottom: 1px solid var(--line); }
  a {
    display: block;
    padding: .6rem 0;
    color: var(--accent);
    text-decoration: none;
  }
  a:hover, a:focus-visible { text-decoration: underline; }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main>

    <li><a href="Altri_Six_sigma/Value_stream_mapping.pdf">Value stream mapping</a></li>
    <li><a href="Altri_Six_sigma/Basic_statistics_for_Six_sigma.pdf">Basic statistics</a></li>
    <li><a href="Altri_Six_sigma/DMAIC.pdf">DMAIC</a></li>
  </ul>
</main>
</body>
</html>
